name: Rust CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check
        run: cargo check --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wechat_test
          POSTGRES_PASSWORD: wechat_test
          POSTGRES_DB: wechat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wechat_test -d wechat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Redis test server
        run: sudo apt-get update && sudo apt-get install --yes redis-server

      - name: Run tests
        env:
          WECHAT_RS_TEST_DATABASE_URL: postgres://wechat_test:wechat_test@127.0.0.1:5432/wechat_test
        run: cargo test --verbose -- --include-ignored --test-threads=1

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --verbose
