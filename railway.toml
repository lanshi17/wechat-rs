[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "wechat-rs"
healthcheckPath = "/api/monitor/status"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "wechat-rs"
protocol = "HTTP"
internalPort = 8080

[services.networking]
httpPort = true